# Prometheus scrape configuration for the EC2 Compose stack (Week 12 box 3).
#
# Unlike infra/prometheus.yml -- which targets the services running on the HOST
# via host.docker.internal over https -- on EC2 the three .NET services run as
# containers on the same Compose network, so each target is the Compose service
# name over plain HTTP inside the container (ASPNETCORE_URLS=http://+:8080).
# scrape_interval stays 5s for the same reason as the local file: Week 13/14
# load runs are minutes long and need enough points to read a ramp or recovery.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-service
    static_configs:
      - targets: ["order-service:8080"]

  - job_name: inventory-service
    # C4 runs 1, 2 or 4 Inventory replicas under the same Compose service name;
    # dns_sd resolves every replica's A record so each is scraped (a static
    # target would only ever hit one of them).
    dns_sd_configs:
      - names: ["inventory-service"]
        type: A
        port: 8080

  - job_name: process-worker
    static_configs:
      - targets: ["process-worker:8080"]

  # rabbitmq_prometheus is enabled by default in the rabbitmq image (port 15692,
  # no credentials); it exposes the global publish/deliver/ack counters that
  # collect-run-metrics.ps1 reads with -RabbitMqMetricsUrl.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
