services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale_dev
      POSTGRES_DB: flashsale
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/01-create-service-roles.sql:/docker-entrypoint-initdb.d/01-create-service-roles.sql:ro

  redis:
    image: redis/redis-stack:7.4.0-v8
    ports: ["6379:6379", "8001:8001"]   # 8001 = RedisInsight UI
    # Added Week 11. Without a volume, every `docker compose down` (or any
    # container recreation) silently discarded seeded inventory, which bit
    # this project twice during Weeks 8-9 testing -- warm-up.ps1 had to be
    # re-run before anyone noticed stock was simply gone. Fixed here rather
    # than later because from Week 13 on that same silence would corrupt an
    # experiment run instead of just a manual test.
    volumes: ["redisdata:/data"]

  rabbitmq:
    image: rabbitmq:3.13.7-management
    ports: ["5672:5672", "15672:15672"] # 15672 = management UI
    environment:
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: flashsale_dev

  nginx:
    image: nginx:1.31.3
    ports: ["8080:80"]
    # Week 12 box 1 (C3 gateway). nginx.conf is mounted as a template so the
    # image's entrypoint envsubst-expands the ${ORDER_*} placeholders below.
    # The upstream and limits are set from the environment; the C3 verifier
    # overrides ORDER_UPSTREAM with its own throwaway Order Service HTTP port.
    environment:
      ORDER_UPSTREAM: "host.docker.internal:44314"
      ORDER_SCHEME: "https"
      ORDER_RATE: "200r/s"
      ORDER_BURST: "100"
    volumes: ["./nginx.conf:/etc/nginx/templates/default.conf.template:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Week 11, Step 11.3. Prometheus scrapes the three .NET services, which run
  # on the HOST rather than in Compose -- hence host.docker.internal targets
  # in prometheus.yml rather than service names.
  prometheus:
    image: prom/prometheus:v3.14.0
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:13.2.2
    ports: ["3000:3000"]
    environment:
      # Anonymous admin access: this is a single-node local/EC2 research rig
      # with no real data in it (docs/00-scope-lock.md excludes auth from the
      # system under test, and the same reasoning applies to its dashboards).
      # Leaving a login prompt in front of the charts would only slow down
      # reading a graph during a load run.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - "./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "grafanadata:/var/lib/grafana"
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
