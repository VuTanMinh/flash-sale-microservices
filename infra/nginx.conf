# C3 gateway (Week 12 box 1). This file is mounted by infra/docker-compose.yml
# into /etc/nginx/templates/default.conf.template, so the official nginx image's
# entrypoint expands the ${ORDER_*} placeholders with envsubst before nginx
# starts and writes the result to /etc/nginx/conf.d/default.conf. That file is
# included inside the http block of the image's nginx.conf, so map and
# limit_req_zone here are valid http context.
#
# Env vars (set in docker-compose.yml, overridden by the verifier):
#   ORDER_UPSTREAM  host.docker.internal:<order service port>  (reverse-proxy target)
#   ORDER_SCHEME    http or https, the upstream scheme          (compose default: https)
#   ORDER_RATE      requests/second shared by POST /api/orders  (e.g. 200r/s)
#   ORDER_BURST     burst for that rate limit, >= 1              (e.g. 100)

# One shared rate-limit bucket for POST /api/orders. JMeter drives the load from
# a single host, so $binary_remote_addr is one key in practice. The key is built
# from "$request_method:$uri" so the limit follows the canonical endpoint
# regardless of letter case or one trailing slash (ASP.NET routing is
# case-insensitive and ignores a trailing slash): POST /api/orders, /api/orders/,
# /API/orders and /Api/Orders all share the bucket, while every GET and every
# other path get the empty key, which nginx's limit_req skips.
map "$request_method:$uri" $order_post_key {
    default                      "";
    "~*^POST:/api/orders/?$"     $binary_remote_addr;
}

# Rate and burst come from the environment (ORDER_RATE / ORDER_BURST).
limit_req_zone $order_post_key zone=order_post_limit:10m rate=${ORDER_RATE};

server {
    listen 80;

    # Applied server-wide so no location can bypass it. The map above gives only
    # POST /api/orders (any case, optional trailing slash) a non-empty key; every
    # other request has an empty key and limit_req skips it.
    limit_req zone=order_post_limit burst=${ORDER_BURST} nodelay;
    limit_req_status 429;

    # The combined log format records $status, so gateway rejections (429) can
    # be counted from the access log.
    access_log /var/log/nginx/access.log;

    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Exact match so POST /api/orders is not 301-redirected to /api/orders/ by
    # the trailing-slash location below (the R6 property). The rate limit itself
    # is applied at server level above, not per-location.
    location = /api/orders {
        proxy_pass ${ORDER_SCHEME}://${ORDER_UPSTREAM};
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GET /api/orders/{id} polling passes through unlimited.
    location /api/orders/ {
        proxy_pass ${ORDER_SCHEME}://${ORDER_UPSTREAM};
        # No-op for http upstreams; for the https dev cert (self-signed) it stops
        # nginx from refusing the upstream certificate.
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else (swagger, the ABP admin UI, identity, /metrics) is NOT
    # exposed through the gateway: only the API under test is. Prometheus
    # scrapes the services directly, not through Nginx.
    location / {
        return 404;
    }
}
