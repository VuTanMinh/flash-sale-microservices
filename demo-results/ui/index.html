<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abel&family=Assistant:wght@400;500;600;700;800&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<!-- Bootstrap 5.3.3, vendored (MIT, vendor/bootstrap-5.3.3/LICENSE) so the page works without internet.
     It is loaded first; the shop's own rules below adjust it through Bootstrap's CSS variables. -->
<link rel="stylesheet" href="vendor/bootstrap-5.3.3/bootstrap.min.css">
<style>
/* Tokens. Light is the default look of the reference screens: navy blocks, white cards, orange accents. */
:root {
  --page: #f5f6f8;
  --card: #ffffff;
  --card-2: #f0f2f5;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #556274;
  --line: #e2e8f0;
  --navy: #0f172a;
  --navy-2: #1e293b;
  --navy-3: #273449;
  --on-navy: #f8fafc;
  --on-navy-muted: #a5b1c4;
  --amber: #f59e0b;
  --orange: #f97316;
  --orange-ink: #ffffff;
  --amber-text: #b45309;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --pink: #fce7ef;
  --butter: #fef3c7;
  --lilac: #ede9fe;
  --sky: #e0f2fe;
  --peach: #ffe4d1;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 10px 30px -12px rgba(15, 23, 42, .18);
  --shadow-lg: 0 2px 4px rgba(15, 23, 42, .06), 0 30px 60px -24px rgba(15, 23, 42, .35);
  --r-lg: 24px;
  --r-md: 16px;
  --f-body: "Assistant", "Lato", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ui: "Lato", "Assistant", "Segoe UI", system-ui, sans-serif;
  --f-special: "Abel", "Lato", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0b1120; --card: #111a2c; --card-2: #18233a; --ink: #e8edf5; --ink-2: #c4cddb; --muted: #94a3b8; --line: #23304a;
  --navy: #060b16; --navy-2: #111a2c; --navy-3: #1b2740; --amber-text: #fbbf24;
  --green: #4ade80; --green-soft: #12301f; --red: #f87171; --red-soft: #3a1717; --blue: #93b4ff; --blue-soft: #18264a;
  --pink: #3a2030; --butter: #3a311a; --lilac: #2a2545; --sky: #16314a; --peach: #3b2a1f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg: 0 30px 60px -24px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0b1120; --card: #111a2c; --card-2: #18233a; --ink: #e8edf5; --ink-2: #c4cddb; --muted: #94a3b8; --line: #23304a;
  --navy: #060b16; --navy-2: #111a2c; --navy-3: #1b2740; --amber-text: #fbbf24;
  --green: #4ade80; --green-soft: #12301f; --red: #f87171; --red-soft: #3a1717; --blue: #93b4ff; --blue-soft: #18264a;
  --pink: #3a2030; --butter: #3a311a; --lilac: #2a2545; --sky: #16314a; --peach: #3b2a1f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg: 0 30px 60px -24px rgba(0,0,0,.7);
  color-scheme: dark; }

/* Bootstrap's own variables, pointed at the shop's tokens so its reboot, cards, tables,
   badges and alerts follow both themes (data-bs-theme is kept in step with data-theme). */
:root, [data-bs-theme] {
  --bs-body-font-family: var(--f-body); --bs-body-font-size: 17px; --bs-body-line-height: 1.55;
  --bs-body-bg: var(--page); --bs-body-color: var(--ink); --bs-emphasis-color: var(--ink);
  --bs-secondary-color: var(--muted); --bs-border-color: var(--line); --bs-heading-color: inherit;
  --bs-code-color: var(--amber-text); --bs-border-radius: 12px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
/* 17px base: readable on a projector */
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: var(--f-ui); font-weight: 800; margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: min(1200px, 100% - 32px); margin-inline: auto; }
.special { font-family: var(--f-special); letter-spacing: .02em; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- top promo ticker */
.ticker { background: var(--orange); color: #fff; font-family: var(--f-special); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; overflow: hidden; white-space: nowrap; }
.ticker .run { display: inline-flex; gap: 36px; padding: 7px 0; animation: marquee 38s linear infinite; }
.ticker .run span::after { content: "✦"; margin-left: 36px; opacity: .8; }

/* ---------- nav (a Bootstrap .navbar, dark variant, coloured with the shop's navy) */
.topnav { position: sticky; top: 0; z-index: 30; padding: 0; background: color-mix(in srgb, var(--navy) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); color: var(--on-navy); border-bottom: 1px solid rgba(255,255,255,.06); }
.topnav .wrap { display: flex; flex-wrap: nowrap; align-items: center; gap: 20px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0; margin: 0; color: var(--on-navy); text-decoration: none; font-family: var(--f-ui); font-weight: 900; font-size: 21px; letter-spacing: -.01em; }
.brand:hover, .brand:focus { color: var(--on-navy); }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, var(--amber), var(--orange)); color: #fff; box-shadow: 0 6px 18px -6px var(--orange); }
.brand-mark svg { width: 20px; height: 20px; }
.brand small { font-family: var(--f-special); font-weight: 400; font-size: 13px; color: var(--on-navy-muted); letter-spacing: .08em; margin-left: 2px; }
.nav-links { display: flex; flex-direction: row; gap: 4px; margin-left: auto; }
.nav-links a { text-decoration: none; font-family: var(--f-ui); font-weight: 700; font-size: 15px; color: var(--on-navy-muted); padding: 8px 12px; border-radius: 999px; }
.nav-links a:hover { color: var(--on-navy); background: rgba(255,255,255,.06); }
.mode { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--on-navy); border-radius: 999px; padding: 6px 12px 6px 10px; font-family: var(--f-ui); font-weight: 700; font-size: 13px; }
.mode .led { width: 8px; height: 8px; border-radius: 50%; background: var(--on-navy-muted); }
.mode.live .led { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.18); }
.mode.sim .led { background: var(--amber); }
.mode.probe .led { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.theme-btn { border: 0; background: transparent; color: var(--on-navy-muted); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.theme-btn:hover { background: rgba(255,255,255,.08); color: var(--on-navy); }
.theme-btn svg { width: 18px; height: 18px; }
@media (max-width: 860px) { .nav-links { display: none; } .mode { margin-left: auto; } }

/* ---------- hero carousel */
.hero { background: var(--navy); color: var(--on-navy); position: relative; overflow: hidden; padding-bottom: 28px; }
.hero::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(600px 300px at 85% 10%, rgba(249,115,22,.22), transparent 70%),
  radial-gradient(500px 320px at 5% 90%, rgba(37,99,235,.18), transparent 70%); pointer-events: none; }
.carousel { position: relative; padding-top: 28px; }
.viewport { overflow: hidden; border-radius: var(--r-lg); }
.track { display: flex; transition: transform .7s cubic-bezier(.65, 0, .25, 1); }
.slide { flex: 0 0 100%; min-height: 380px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center; gap: 24px; padding: 40px 48px; border-radius: var(--r-lg); position: relative; overflow: hidden; }
.slide.s-peach { background: linear-gradient(120deg, #1e293b 0%, #1e293b 46%, #fdba74 46%, #fed7aa 100%); }
.slide.s-navy { background: linear-gradient(140deg, #1e293b, #0f172a 70%); border: 1px solid rgba(255,255,255,.06); }
.slide.s-amber { background: linear-gradient(120deg, #1e293b 0%, #1e293b 50%, #fcd34d 50%, #fbbf24 100%); }
.slide.s-sky { background: linear-gradient(120deg, #1e293b 0%, #1e293b 50%, #bae6fd 50%, #93c5fd 100%); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-special); font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: currentColor; }
.slide h2 { font-size: clamp(30px, 4.2vw, 52px); font-weight: 900; letter-spacing: -.02em; margin: 12px 0 14px; }
.slide p.lead { color: var(--on-navy-muted); font-size: 19px; font-weight: 400; max-width: 46ch; }
.slide .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.comic { display: inline-block; font-family: "Lato", var(--f-ui); font-weight: 900; text-transform: uppercase; line-height: .86; letter-spacing: -.01em;
  font-size: clamp(54px, 8.4vw, 116px); color: #fff; transform: rotate(-6deg); transform-origin: left center;
  -webkit-text-stroke: 3px var(--navy); paint-order: stroke fill;
  text-shadow: 5px 5px 0 var(--orange), 10px 10px 0 #0b1222; margin: 18px 0 22px 4px; }
.comic .alt { color: var(--amber); }
.comic.sm { font-size: clamp(44px, 6.4vw, 88px); }
.slide-art { position: relative; display: grid; place-items: center; min-height: 280px; }
.slide-art svg.art { width: min(100%, 380px); height: auto; filter: drop-shadow(0 30px 40px rgba(15,23,42,.35)); }
.sticker { position: absolute; font-family: var(--f-ui); font-weight: 900; color: #fff; background: var(--orange); border-radius: 999px; padding: 10px 16px; transform: rotate(8deg); box-shadow: 0 10px 24px -8px rgba(249,115,22,.7); font-size: 18px; line-height: 1; text-align: center; }
.sticker small { display: block; font-family: var(--f-special); font-weight: 400; font-size: 12px; letter-spacing: .12em; opacity: .95; }
.c-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.dots { display: flex; gap: 8px; }
.dots button { width: 10px; height: 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,.25); padding: 0; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { width: 34px; background: var(--amber); }
.c-btns { display: flex; gap: 8px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04); color: var(--on-navy); display: grid; place-items: center; }
.round:hover { background: rgba(255,255,255,.1); }
.round svg { width: 18px; height: 18px; }
@media (max-width: 860px) {
  .slide { grid-template-columns: 1fr; padding: 28px 22px 24px; min-height: 0; gap: 8px; }
  .slide.s-peach, .slide.s-amber, .slide.s-sky { background: linear-gradient(180deg, #1e293b 0%, #1e293b 64%, var(--bandc, #fdba74) 64%); }
  .slide.s-peach { --bandc: #fdba74; } .slide.s-amber { --bandc: #fcd34d; } .slide.s-sky { --bandc: #93c5fd; }
  .slide-art { min-height: 200px; } .slide-art svg.art { width: min(78%, 280px); }
  .slide p.lead { font-size: 16px; }
}

/* ---------- wallet-like status strip inside the navy block */
.strip { margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--navy-2); border: 1px solid rgba(255,255,255,.07); border-radius: var(--r-md); overflow: hidden; }
.strip > div { padding: 14px 18px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.strip > div + div { border-left: 1px solid rgba(255,255,255,.07); }
.strip .ic { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--navy-3); color: var(--amber); }
.strip .ic svg { width: 20px; height: 20px; }
.strip .k { font-size: 13px; color: var(--on-navy-muted); }
.strip .v { font-family: var(--f-ui); font-weight: 900; font-size: 20px; color: var(--on-navy); line-height: 1.1; }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip > div:nth-child(3) { border-left: 0; } .strip > div:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,.07); } }

/* ---------- section headers */
section.block { padding: 64px 0 8px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 24px; margin-bottom: 22px; }
.sec-head h2 { font-size: clamp(28px, 3.4vw, 42px); font-weight: 900; letter-spacing: -.02em; }
.sec-head p { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.kicker { font-family: var(--f-special); text-transform: uppercase; letter-spacing: .18em; font-size: 14px; color: var(--orange); display: block; margin-bottom: 8px; }

/* ---------- flash sale screen */
.fs-top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.fs-title { display: flex; align-items: center; gap: 12px; }
.fs-title h2 { font-size: clamp(30px, 3.6vw, 44px); }
.bolt-badge { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--amber), var(--orange)); color: #fff; box-shadow: 0 8px 20px -8px var(--orange); display: grid; place-items: center; transform: rotate(-8deg); }
.bolt-badge svg { width: 24px; height: 24px; }
.clock { display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: var(--amber); border-radius: 999px; padding: 8px 14px 8px 10px; font-family: var(--f-ui); font-weight: 900; font-size: 17px; letter-spacing: .04em; }
.clock svg { width: 18px; height: 18px; }
.clock small { font-family: var(--f-special); font-weight: 400; font-size: 13px; letter-spacing: .1em; color: var(--on-navy-muted); text-transform: uppercase; margin-right: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 22px; }
/* Buttons are Bootstrap .btn; each shop variant only sets Bootstrap's --bs-btn-* variables. */
.pill-btn { --bs-btn-padding-x: 16px; --bs-btn-padding-y: 8px; --bs-btn-font-family: var(--f-ui); --bs-btn-font-weight: 700; --bs-btn-font-size: 15px;
  --bs-btn-border-radius: 999px; --bs-btn-border-width: 1.5px; --bs-btn-color: var(--ink-2); --bs-btn-bg: var(--card); --bs-btn-border-color: var(--line);
  --bs-btn-hover-color: var(--ink); --bs-btn-hover-bg: var(--card); --bs-btn-hover-border-color: var(--ink-2);
  --bs-btn-active-color: var(--page); --bs-btn-active-bg: var(--ink); --bs-btn-active-border-color: var(--ink);
  --bs-btn-disabled-color: var(--ink-2); --bs-btn-disabled-bg: var(--card); --bs-btn-disabled-border-color: var(--line); --bs-btn-disabled-opacity: .45; }
.pill-btn[aria-pressed="true"] { --bs-btn-color: var(--page); --bs-btn-bg: var(--ink); --bs-btn-border-color: var(--ink); --bs-btn-hover-color: var(--page); --bs-btn-hover-bg: var(--ink); --bs-btn-hover-border-color: var(--ink); }
.pill-btn.go { --bs-btn-color: #fff; --bs-btn-bg: var(--orange); --bs-btn-border-color: var(--orange); --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #ea580c; --bs-btn-hover-border-color: #ea580c;
  --bs-btn-disabled-color: #fff; --bs-btn-disabled-bg: var(--orange); --bs-btn-disabled-border-color: var(--orange); }
.pill-btn select { border: 0; background: transparent; color: inherit; font-weight: 700; }
.scenario-note { color: var(--muted); font-size: 16px; margin: -10px 0 22px; max-width: 80ch; }

.fs-grid { margin-top: 0; }

.card { --bs-card-bg: var(--card); --bs-card-color: var(--ink); background: var(--card); color: var(--ink); border-radius: var(--r-lg); box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.product { overflow: hidden; }
.p-media { position: relative; background: var(--peach); aspect-ratio: 5 / 4; display: grid; place-items: center; overflow: hidden; }
.p-media::after { content: ""; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.45); z-index: 0; }
:root[data-theme="dark"] .p-media::after { background: rgba(255,255,255,.07); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p-media::after { background: rgba(255,255,255,.07); } }
.p-media svg.art { width: 62%; position: relative; z-index: 1; filter: drop-shadow(0 22px 26px rgba(15,23,42,.22)); }
.p-badge { position: absolute; top: 16px; left: 16px; z-index: 2; background: var(--orange); color: var(--orange-ink); font-family: var(--f-ui); font-weight: 900; border-radius: 10px; padding: 6px 10px; font-size: 15px; box-shadow: 0 6px 16px -6px rgba(249,115,22,.8); }
.heart { position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink-2); display: grid; place-items: center; box-shadow: var(--shadow); }
.heart svg { width: 20px; height: 20px; }
.heart[aria-pressed="true"] { color: #e11d48; }
.heart[aria-pressed="true"] svg path { fill: currentColor; }
.state-tag { position: absolute; bottom: 16px; left: 16px; z-index: 2; font-family: var(--f-special); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; background: var(--navy); color: #fff; border-radius: 999px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 8px; }
.state-tag .led { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
.state-tag.live .led { background: #22c55e; animation: blink 1.2s infinite; }
.state-tag.soldout { background: #475569; }
.p-body { padding: 22px 24px 24px; display: grid; gap: 16px; }
.p-name { font-family: var(--f-ui); font-weight: 900; font-size: 24px; letter-spacing: -.01em; }
.p-sku { font-family: var(--f-special); color: var(--muted); font-size: 14px; letter-spacing: .06em; }
.price-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.price-now { font-family: var(--f-ui); font-weight: 900; font-size: 32px; color: var(--orange); }
.price-was { color: var(--muted); text-decoration: line-through; font-size: 17px; }
.sold-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; }
.sold-row b { font-family: var(--f-ui); color: var(--amber-text); }
.meter { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--navy); transition: width .45s ease; position: relative; }
:root[data-theme="dark"] .meter > span { background: var(--amber); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .meter > span { background: var(--amber); } }
.buy { --bs-btn-padding-x: 20px; --bs-btn-padding-y: 17px; --bs-btn-font-family: var(--f-ui); --bs-btn-font-weight: 900; --bs-btn-font-size: 19px; --bs-btn-border-radius: 18px; --bs-btn-border-width: 0;
  --bs-btn-color: #fff; --bs-btn-bg: var(--navy); --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #1e293b; --bs-btn-active-color: #fff; --bs-btn-active-bg: #1e293b;
  --bs-btn-disabled-color: var(--muted); --bs-btn-disabled-bg: var(--card-2); --bs-btn-disabled-opacity: 1;
  width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 14px 30px -14px rgba(15,23,42,.7); transition: transform .08s ease, background .2s; position: relative; overflow: hidden; }
:root[data-theme="dark"] .buy { --bs-btn-bg: var(--orange); --bs-btn-hover-bg: #ea580c; --bs-btn-active-bg: #ea580c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .buy { --bs-btn-bg: var(--orange); --bs-btn-hover-bg: #ea580c; --bs-btn-active-bg: #ea580c; } }
.buy svg { width: 20px; height: 20px; }
.buy:active:not(:disabled) { transform: scale(.985); }
.buy:disabled { cursor: not-allowed; box-shadow: none; }
.buy.busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transform: translateX(-100%); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.fine { font-size: 13px; color: var(--muted); }

/* Messages are Bootstrap alerts (alert-warning for 429/503, alert-danger for errors and
   sold out, alert-success, alert-info); .note only makes them compact. */
.note { border-radius: 14px; padding: 12px 14px; margin: 0; font-size: 16px; display: grid; gap: 6px; }
.note b { font-family: var(--f-ui); }
.code-badge { font-family: var(--f-mono); font-size: 13px; margin-right: 6px; vertical-align: 1px; }
.backoff { height: 4px; border-radius: 4px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }
.backoff > span { display: block; height: 100%; background: currentColor; }

/* order tracking card, styled like a transaction list */
.track-card { padding: 20px 22px; display: grid; gap: 14px; }
.track-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.track-head h3 { font-size: 19px; font-weight: 900; }
/* order-state badges: Bootstrap .badge with one text-bg-* colour per state */
.state-badge { font-family: var(--f-ui); font-weight: 800; font-size: 14px; letter-spacing: .02em; padding: .45em .85em; }
.state-badge.sm { font-size: 12px; padding: .35em .7em; }
.hist-table { --bs-table-bg: transparent; --bs-table-striped-bg: color-mix(in srgb, var(--line) 45%, transparent); --bs-table-color: var(--ink); --bs-table-striped-color: var(--ink); font-size: 14px; }
.hist-table th { font-family: var(--f-ui); font-weight: 700; font-size: 13px; color: var(--muted); }
.ids-table { --bs-table-bg: transparent; --bs-table-color: var(--ink-2); margin: 0; font-family: var(--f-mono); font-size: 13px; }
.ids-table th { font-family: var(--f-ui); font-weight: 700; color: var(--muted); white-space: nowrap; padding-right: 12px; width: 1%; }
.ids-table td { word-break: break-all; }
.tx { list-style: none; margin: 0; padding: 0; display: grid; }
.tx li { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.tx li + li { border-top: 1px dashed var(--line); }
.tx .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--muted); }
.tx .ic svg { width: 20px; height: 20px; }
.tx li.done .ic { background: var(--green-soft); color: var(--green); }
.tx li.now .ic { background: var(--butter); color: var(--amber-text); animation: ring 1.4s infinite; }
.tx li.fail .ic { background: var(--red-soft); color: var(--red); }
@keyframes ring { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--amber) 22%, transparent); } }
.tx .t { font-family: var(--f-ui); font-weight: 700; font-size: 15px; }
.tx .s { font-size: 13px; color: var(--muted); }
.tx .r { text-align: right; font-size: 13px; }
.tx .r b { display: block; font-family: var(--f-ui); font-size: 13px; }
.tx li.done .r b { color: var(--green); } .tx li.now .r b { color: var(--amber-text); } .tx li.fail .r b { color: var(--red); } .tx li.todo .r b { color: var(--muted); font-weight: 400; }
.ids { font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: grid; gap: 2px; word-break: break-all; background: var(--card-2); border-radius: 12px; padding: 10px 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { --bs-btn-padding-x: 14px; --bs-btn-padding-y: 9px; --bs-btn-font-family: var(--f-ui); --bs-btn-font-weight: 700; --bs-btn-font-size: 15px; --bs-btn-border-radius: 12px; --bs-btn-border-width: 1.5px;
  --bs-btn-color: var(--ink-2); --bs-btn-bg: var(--card); --bs-btn-border-color: var(--line);
  --bs-btn-hover-color: var(--ink); --bs-btn-hover-bg: var(--card); --bs-btn-hover-border-color: var(--ink-2);
  --bs-btn-active-color: var(--ink); --bs-btn-active-bg: var(--card-2); --bs-btn-active-border-color: var(--ink-2);
  --bs-btn-disabled-color: var(--ink-2); --bs-btn-disabled-bg: var(--card); --bs-btn-disabled-border-color: var(--line); --bs-btn-disabled-opacity: .5; }
.cta { --bs-btn-padding-x: 22px; --bs-btn-padding-y: 14px; --bs-btn-font-family: var(--f-ui); --bs-btn-font-weight: 900; --bs-btn-font-size: 17px; --bs-btn-border-radius: 16px; --bs-btn-border-width: 0;
  --bs-btn-color: #fff; --bs-btn-bg: var(--orange); --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #ea580c; --bs-btn-active-color: #fff; --bs-btn-active-bg: #c2410c;
  text-decoration: none; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 14px 30px -14px rgba(249,115,22,.9); }
.cta.dark { --bs-btn-color: var(--navy); --bs-btn-bg: #fff; --bs-btn-hover-color: var(--navy); --bs-btn-hover-bg: #e2e8f0; --bs-btn-active-color: var(--navy); --bs-btn-active-bg: #cbd5e1; box-shadow: none; }
.cta svg { width: 18px; height: 18px; }

/* pipeline side */
.sys { padding: 22px; display: grid; gap: 18px; min-width: 0; }
.sys-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sys-head h3 { font-size: 20px; font-weight: 900; }
.chip { font-family: var(--f-special); font-weight: 400; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; padding: 5px 11px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; }
@media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.kpi { border-radius: 16px; padding: 12px 14px; background: var(--card-2); }
.kpi:nth-child(1) { background: var(--sky); } .kpi:nth-child(2) { background: var(--pink); } .kpi:nth-child(3) { background: var(--butter); } .kpi:nth-child(4) { background: var(--lilac); } .kpi:nth-child(5) { background: var(--green-soft); }
.kpi .k { font-size: 13px; color: var(--ink-2); }
.kpi .v { font-family: var(--f-ui); font-weight: 900; font-size: 26px; line-height: 1.15; }
.kpi .v small { font-family: var(--f-body); font-size: 13px; font-weight: 600; color: var(--muted); }
.pipe { display: grid; gap: 0; }
.stage { display: grid; grid-template-columns: 46px minmax(0, 1fr) minmax(0, 210px); gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); position: relative; transition: border-color .25s, background .25s, box-shadow .25s; }
.stage.here { border-color: var(--orange); background: color-mix(in srgb, var(--orange) 7%, var(--card)); box-shadow: 0 10px 26px -16px rgba(249,115,22,.7); }
.stage .logo { width: 46px; height: 46px; border-radius: 14px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; position: relative; }
.stage .logo svg { width: 26px; height: 26px; }
.stage .logo .sub { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; }
.stage .logo .sub svg { width: 15px; height: 15px; }
.stage h4 { font-size: 15px; font-weight: 900; }
.stage .what { font-size: 13px; color: var(--muted); line-height: 1.4; }
.stage .nums { font-family: var(--f-mono); font-size: 12px; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.stage .nums .bad { color: var(--red); } .stage .nums .ok { color: var(--green); }
.you { position: absolute; top: -11px; right: 12px; background: var(--orange); color: #fff; font-family: var(--f-special); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; padding: 2px 9px; border-radius: 999px; }
.link { height: 22px; margin-left: 36px; border-left: 2px dashed var(--line); display: flex; align-items: center; padding-left: 26px; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.qbar { height: 6px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
.qbar > span { display: block; height: 100%; background: var(--orange); transition: width .25s; }
@media (max-width: 600px) { .stage { grid-template-columns: 46px minmax(0, 1fr); } .stage .nums { grid-column: 1 / -1; } .link { margin-left: 22px; } }
.log { background: var(--navy); color: #cbd5e1; border-radius: 16px; padding: 12px 14px; font-family: var(--f-mono); font-size: 12px; max-height: 220px; overflow: auto; display: grid; gap: 3px; }
.log div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; }
.log time { color: #64748b; }
.log .src { color: var(--amber); }
.log .e-bad { color: #fca5a5; } .log .e-ok { color: #86efac; }
.offline { display: grid; gap: 8px; }

/* more in this drop (a Bootstrap row: 2 columns, 4 from lg) */
.drop { margin-top: 10px; }
.tile { overflow: hidden; }
.tile .p-media { aspect-ratio: 1; }
.tile .p-media svg.art { width: 58%; }
.tile .p-badge { font-size: 13px; padding: 4px 8px; top: 12px; left: 12px; }
.tile .heart { width: 34px; height: 34px; top: 10px; right: 10px; }
.tile .heart svg { width: 17px; height: 17px; }
.tile .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.tile .nm { font-family: var(--f-ui); font-weight: 700; font-size: 16px; }
.tile .pr { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tile .pr b { font-family: var(--f-ui); font-weight: 900; color: var(--orange); font-size: 18px; }
.tile .pr s { color: var(--muted); font-size: 13px; }
.tile .soon { font-family: var(--f-special); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--muted); }

/* stack marquee */
.stack { background: var(--navy); color: var(--on-navy); margin-top: 72px; padding: 56px 0 60px; overflow: hidden; position: relative; }
.stack .sec-head p { color: var(--on-navy-muted); }
.stack .sec-head h2 { color: #fff; }
.marquee { position: relative; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee + .marquee { margin-top: 14px; }
.m-run { display: flex; gap: 14px; width: max-content; animation: marquee 46s linear infinite; }
.marquee.rev .m-run { animation-direction: reverse; animation-duration: 52s; }
.marquee:hover .m-run, .marquee:focus-within .m-run { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.tech { display: flex; align-items: center; gap: 12px; background: #fff; color: var(--navy); border-radius: 18px; padding: 12px 18px 12px 12px; min-width: 210px; }
.tech .lg { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #f1f5f9; flex: none; }
.tech .lg svg { width: 26px; height: 26px; }
.tech .lg .abp { font-family: var(--f-ui); font-weight: 900; font-size: 13px; color: #fff; background: #e1251b; border-radius: 7px; padding: 4px 5px; letter-spacing: .02em; }
.tech b { font-family: var(--f-ui); font-weight: 900; font-size: 15px; display: block; line-height: 1.2; }
.tech span { font-size: 13px; color: #475569; }
.stack-pause { margin-top: 18px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--on-navy-muted); border-radius: 999px; padding: 6px 14px; font-family: var(--f-ui); font-weight: 700; font-size: 13px; }
.stack.paused .m-run { animation-play-state: paused; }

/* how it works + measured */
/* .steps3 and .measured are Bootstrap rows (row-cols-*), so these rules only style the cards */
.step { padding: 24px; display: grid; gap: 10px; align-content: start; }
.step .num { font-family: var(--f-special); font-size: 15px; letter-spacing: .14em; color: var(--orange); }
.step h3 { font-size: 21px; font-weight: 900; }
.step p { color: var(--muted); font-size: 15px; }
.step .logos { display: flex; gap: 8px; margin-top: 4px; }
.step .logos span { width: 36px; height: 36px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; }
.step .logos svg { width: 20px; height: 20px; }
.stat { padding: 22px; display: grid; gap: 6px; align-content: start; }
.stat .big { font-family: var(--f-ui); font-weight: 900; font-size: clamp(34px, 3.6vw, 46px); letter-spacing: -.02em; line-height: 1; }
.stat .big .arrow { color: var(--orange); }
.stat .lbl { font-family: var(--f-ui); font-weight: 700; }
.stat p { color: var(--muted); font-size: 14px; }
.measured > .col:nth-child(1) .stat { background: var(--sky); } .measured > .col:nth-child(2) .stat { background: var(--butter); } .measured > .col:nth-child(3) .stat { background: var(--pink); } .measured > .col:nth-child(4) .stat { background: var(--lilac); }
.src-note { margin-top: 14px; font-size: 13px; color: var(--muted); }

/* footer + mobile tab bar */
footer { margin-top: 72px; padding: 30px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
.tabbar { display: none; }
@media (max-width: 720px) {
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--navy); border-radius: 22px; padding: 8px; box-shadow: var(--shadow-lg); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; text-decoration: none; color: var(--on-navy-muted); font-family: var(--f-ui); font-weight: 700; font-size: 11px; padding: 6px 0; border-radius: 14px; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a.on { color: #fff; background: rgba(255,255,255,.08); }
  .tabbar a.on svg { color: var(--amber); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .m-run { flex-wrap: wrap; width: auto; justify-content: center; }
  .m-run [data-dup] { display: none; }
  .marquee { -webkit-mask-image: none; mask-image: none; }
  .ticker .run { white-space: normal; padding-inline: 16px; }
  .ticker .run [data-dup] { display: none; }
}

function StateBadge({ s, small }: { s: string; small?: boolean }) {

}

const hex = (n: number) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, "0")).join("");
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : `${hex(4)}-${hex(2)}-${hex(2)}-${hex(2)}-${hex(6)}`);
const vnd = (n: number) => n.toLocaleString("vi-VN") + " ₫";
const pad = (n: number) => String(Math.max(0, Math.floor(n))).padStart(2, "0");
const hms = (sec: number) => `${pad(sec / 3600)}:${pad((sec % 3600) / 60)}:${pad(sec % 60)}`;
const short = (id: string) => (id.length > 12 ? id.slice(0, 8) + "…" : id);
const safe = {
  get(k: string): any { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch { return null; } },
  set(k: string, v: any) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked: the page still works */ } },
  del(k: string) { try { localStorage.removeItem(k); } catch { } },
};

function useReducedMotion() {
  const q = typeof matchMedia === "function" ? matchMedia("(prefers-reduced-motion: reduce)") : null;
  const [r, setR] = useState(!!q?.matches);
  useEffect(() => { if (!q) return; const f = () => setR(q.matches); q.addEventListener?.("change", f); return () => q.removeEventListener?.("change", f); }, []);
  return r;
}

async function fetchT(url: string, init: RequestInit, ms: number) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...init, signal: c.signal, cache: "no-store" }); } finally { clearTimeout(t); }
}
const api = {
  /** The page is live when the gateway answers GET /api/orders/{unknown id} with 404 (Order Service reached, no such order). */
  async probe(): Promise<{ ok: boolean; why: string }> {
    if (location.protocol === "file:") return { ok: false, why: "opened as a file, so there is no gateway behind it" };
    try {
      const r = await fetchT("/api/orders/00000000-0000-0000-0000-000000000000", {}, 2500);
      if (r.status === 404 || r.status === 200) return { ok: true, why: "" };
      return { ok: false, why: `the gateway answered ${r.status}` };
    } catch (e: any) { return { ok: false, why: e?.name === "AbortError" ? "no answer within 2.5 s" : "the gateway could not be reached" }; }
  },
  view(b: any, corr?: string | null): View {
    const acc = Date.parse(b.requestAcceptedAt);
    const rel = (s?: string | null) => (s ? Date.parse(s) - acc : undefined);
    const hist = (b.history ?? []).map((h: any) => ({ from: h.from, to: h.to, at: Date.parse(h.at) - acc, implied: h.implied }));
    const proc = hist.find((h: any) => h.to === "Processing");
    return { id: b.id, state: b.state, corr: corr ?? undefined, history: hist,
      t: { published: b.state !== "PendingStock" ? undefined : undefined, decided: rel(b.confirmedOrRejectedAt), processing: proc ? proc.at : undefined, completed: rel(b.completedAt) } };
  },
  async place(key: string): Promise<Attempt & { ms: number; corr?: string | null }> {
    const t0 = performance.now();
    try {
      const r = await fetchT("/api/orders", { method: "POST", headers: { "Content-Type": "application/json", "Idempotency-Key": key },
        body: JSON.stringify({ productId: PRODUCT_ID, quantity: 1 }) }, 10000);
      const ms = performance.now() - t0; const text = await r.text(); let body: any = text; try { body = JSON.parse(text); } catch { }
      const corr = r.headers.get("X-Correlation-Id");
      if (r.status === 201 || r.status === 200) return { status: r.status, view: api.view(body, corr), ms, corr };
      if (r.status === 429) return { status: 429, ms };
      if (r.status === 503) return { status: 503, retryAfter: Number(r.headers.get("Retry-After")) || 1, reason: typeof body === "string" ? body : "busy", ms };
      return { status: (r.status as any), message: typeof body === "string" ? body : JSON.stringify(body), ms };
    } catch (e: any) { return { status: 0, message: e?.name === "AbortError" ? "no answer within 10 s" : "the gateway could not be reached", ms: performance.now() - t0 }; }
  },
  async get(id: string): Promise<View | null> {
    const r = await fetchT(`/api/orders/${encodeURIComponent(id)}`, {}, 5000);
    if (!r.ok) return null; return api.view(await r.json());
  },
};

/* ------------------------------------------------- the simulated backend */
class FlashSim {
  sc: Scenario; t0 = performance.now(); now = 0; started = false;
  stock = 0; initial = 0; workerConcurrency = 8;
  nginxTokens = 0; crowdCarry = 0; invBudget = 0;
  outbox: Array<{ o: SimOrder; at: number }> = [];
  invQueue: SimOrder[] = []; workerQueue: SimOrder[] = []; busy: Array<{ o: SimOrder; doneAt: number }> = [];
  byId = new Map<string, SimOrder>(); byKey = new Map<string, string>();
  forced: Scenario["forcedForUser"] = [];
  c = { offered: 0, r429: 0, r503: 0, accepted: 0, reserved: 0, rejected: 0, completed: 0 };
  log: LogLine[] = []; soldLogged = false; openLogged = false;
  rate = { offered: 0, accepted: 0, decided: 0, completed: 0 }; private last = { offered: 0, accepted: 0, decided: 0, completed: 0, at: 0 };

  constructor(sc: Scenario, workerConcurrency: number) { this.sc = sc; this.workerConcurrency = workerConcurrency; this.reset(); }
  reset() {
    const sc = this.sc;
    this.t0 = performance.now(); this.now = 0; this.started = false;
    this.stock = sc.stock; this.initial = sc.stock; this.nginxTokens = sc.nginxBurst;
    this.outbox = []; this.invQueue = []; this.workerQueue = []; this.busy = [];
    this.byId.clear(); this.byKey.clear(); this.forced = [...sc.forcedForUser];
    this.c = { offered: 0, r429: 0, r503: 0, accepted: 0, reserved: 0, rejected: 0, completed: 0 };
    this.log = []; this.soldLogged = false; this.openLogged = false; this.crowdCarry = 0; this.invBudget = 0;
    this.rate = { offered: 0, accepted: 0, decided: 0, completed: 0 }; this.last = { offered: 0, accepted: 0, decided: 0, completed: 0, at: 0 };
    this.say("warm-up", `Loading stock for ${PRODUCT_ID} into Redis: ${sc.stock} units`);
  }
  start() { this.started = true; this.t0 = performance.now(); this.now = 0;
    this.say("warm-up", `Stock confirmed (read back ${this.stock}). Sale opens in ${this.sc.countdownSec} s`); }
  get openAt() { return this.sc.countdownSec * 1000; }
  get status(): SaleStatus { if (!this.started || this.now < this.openAt) return "upcoming"; return this.stock > 0 ? "live" : "soldout"; }
  get inFlight() { return this.c.accepted - this.c.completed - this.c.rejected; }
  say(src: string, text: string, tone?: LogLine["tone"]) { this.log.push({ at: this.now, src, text, tone }); if (this.log.length > 200) this.log.shift(); }

  private mkOrder(user: boolean, key: string): SimOrder {
    const id = `o-${hex(3)}`;
    const o: SimOrder = { id, key, corr: `c-${hex(3)}`, user, state: "PendingStock", history: [{ to: "PendingStock", at: this.now }], ts: { accepted: this.now }, msgIds: [] };
    this.c.accepted++;
    if (user) { this.byId.set(id, o); this.byKey.set(key, id); }
    this.outbox.push({ o, at: this.now + OUTBOX_PUBLISH_MS });
    return o;
  }
  private move(o: SimOrder, to: OrderState) { o.state = to; o.history.push({ to, at: this.now }); }
  view(o: SimOrder): View {
    const at = (s: OrderState) => o.history.find(h => h.to === s)?.at;
    const a = o.ts.accepted; const rel = (x?: number) => (x === undefined ? undefined : x - a);
    let prev: string | null = null;
    return { id: o.id, state: o.state, corr: o.corr, msgIds: [...o.msgIds],
      t: { published: rel(o.ts.published), decided: rel(o.ts.decided), processing: rel(at("Processing")), completed: rel(o.ts.completed) },
      history: o.history.map(h => { const r = { from: prev, to: h.to, at: h.at - a }; prev = h.to; return r; }) };
  }
  submit(key: string): Attempt {
    if (this.byKey.has(key)) {
      const o = this.byId.get(this.byKey.get(key)!)!;
      this.say("order-svc", `Idempotency-Key ${key.slice(0, 8)}… seen before: returned the original order ${o.id}, no new order`, "ok");
      return { status: 200, view: this.view(o) };
    }
    this.c.offered++;
    const f = this.forced.shift();
    if (f?.status === 429) { this.c.r429++; this.say("nginx", "429 Too Many Requests: rate limit reached, refused before the service", "bad"); return { status: 429 }; }
    if (f?.status === 503) { this.c.r503++; this.say("order-svc", `503 Service Unavailable (${f.reason}), Retry-After ${f.retryAfter} s. Nothing was written`, "bad");
      return { status: 503, retryAfter: f.retryAfter ?? 2, reason: f.reason ?? "inflight" }; }
    const o = this.mkOrder(true, key);
    this.say("order-svc", `201 Created ${o.id}: saved as PendingStock with OrderPlaced in the Outbox, one transaction`, "ok");
    return { status: 201, view: this.view(o) };
  }
  get(id: string): SimOrder | undefined { return this.byId.get(id); }
  restore(saved: { orderId: string; key: string }): SimOrder {
    const o: SimOrder = { id: saved.orderId, key: saved.key, corr: `c-${hex(3)}`, user: true, state: "PendingStock", history: [{ to: "PendingStock", at: this.now }], ts: { accepted: this.now }, msgIds: [] };
    this.byId.set(o.id, o); this.byKey.set(o.key, o.id); this.c.accepted++;
    this.outbox.push({ o, at: this.now + OUTBOX_PUBLISH_MS });
    this.say("order-svc", `Order ${o.id} found again after the page reload`);
    return o;
  }
  positionOf(o: SimOrder): { stage: string; ahead: number } {
    if (o.state === "PendingStock") {
      const ob = this.outbox.findIndex(x => x.o === o);
      if (ob >= 0) return { stage: "outbox", ahead: this.invQueue.length + ob };
      return { stage: "inventory", ahead: Math.max(0, this.invQueue.indexOf(o)) };
    }
    if (o.state === "Confirmed") return { stage: "worker", ahead: Math.max(0, this.workerQueue.indexOf(o)) };
    if (o.state === "Processing") return { stage: "worker", ahead: 0 };
    return { stage: "done", ahead: 0 };
  }
  tick() {
    const now = performance.now() - this.t0; const dt = Math.min(250, now - this.now); this.now = now;
    if (!this.started) return;
    const sc = this.sc; const open = now >= this.openAt;
    if (open && !this.openLogged) { this.openLogged = true; this.say("inventory", `Warm-up gate open: sale:open:${PRODUCT_ID} set, Buy enabled`, "ok"); }
    this.nginxTokens = Math.min(sc.nginxBurst, this.nginxTokens + sc.nginxRatePerSec * dt / 1000);
    if (open && now - this.openAt < sc.crowdSeconds * 1000) {
      this.crowdCarry += sc.crowdPerSec * dt / 1000;
      while (this.crowdCarry >= 1) {
        this.crowdCarry--; this.c.offered++;
        if (this.nginxTokens < 1) { this.c.r429++; continue; }
        this.nginxTokens--;
        if (sc.maxInFlight > 0 && this.inFlight >= sc.maxInFlight) { this.c.r503++; continue; }
        this.mkOrder(false, "");
      }
    }
    while (this.outbox.length && this.outbox[0].at <= now) {
      const { o } = this.outbox.shift()!; o.ts.published = now; o.msgIds.push(`m-${hex(3)}`);
      if (o.user) this.say("outbox", `OrderPlaced for ${o.id} published to RabbitMQ, broker confirmed (message ${o.msgIds[0]})`);
      this.invQueue.push(o);
    }
    this.invBudget = Math.min(INVENTORY_DECISIONS_PER_SEC, this.invBudget + INVENTORY_DECISIONS_PER_SEC * dt / 1000);
    while (this.invBudget >= 1 && this.invQueue.length) {
      this.invBudget--; const o = this.invQueue.shift()!; o.ts.decided = now; o.msgIds.push(`m-${hex(3)}`);
      if (this.stock > 0) {
        this.stock--; this.c.reserved++; this.move(o, "Confirmed"); this.workerQueue.push(o);
        if (o.user) this.say("inventory", `Lua script: not a duplicate, stock ${this.stock + 1} > 0, deducted 1 → StockReserved for ${o.id}`, "ok");
      } else {
        this.c.rejected++; this.move(o, "Rejected");
        if (o.user) this.say("inventory", `Lua script: stock is 0 → StockRejected for ${o.id}. Nothing deducted`, "bad");
      }
      if (this.stock === 0 && !this.soldLogged) { this.soldLogged = true; this.say("inventory", `Sold out: ${this.initial} of ${this.initial} units reserved, never more`); }
    }
    for (let i = this.busy.length - 1; i >= 0; i--) {
      const b = this.busy[i];
      if (b.doneAt <= now) { this.busy.splice(i, 1); this.move(b.o, "Completed"); b.o.ts.completed = now; this.c.completed++;
        if (b.o.user) this.say("worker", `${b.o.id} finished after ${WORKER_DELAY_MS} ms → Completed`, "ok"); }
    }
    while (this.busy.length < this.workerConcurrency && this.workerQueue.length) {
      const o = this.workerQueue.shift()!; this.move(o, "Processing"); this.busy.push({ o, doneAt: now + WORKER_DELAY_MS });
      if (o.user) this.say("worker", `Started ${o.id} (the order ID is the Worker's idempotency key) → Processing`);
    }
    if (now - this.last.at >= 1000) {
      const s = (now - this.last.at) / 1000; const decided = this.c.reserved + this.c.rejected;
      this.rate = { offered: (this.c.offered - this.last.offered) / s, accepted: (this.c.accepted - this.last.accepted) / s,
        decided: (decided - this.last.decided) / s, completed: (this.c.completed - this.last.completed) / s };
      this.last = { offered: this.c.offered, accepted: this.c.accepted, decided, completed: this.c.completed, at: now };
    }
  }
}
