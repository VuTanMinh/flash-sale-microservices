          <div className="dots">{slides.map((_, k) => <button key={k} aria-label={`Show slide ${k + 1}`} aria-current={k === i} onClick={() => go(k)}/>)}</div>
          <div className="c-btns">
            {!reduce && <button className="round" onClick={() => setUserPaused(p => !p)} aria-label={userPaused ? "Play the slides" : "Pause the slides"}>{userPaused ? I.play : I.pause}</button>}
            <button className="round" onClick={() => go(i - 1)} aria-label="Previous slide">{I.left}</button>
            <button className="round" onClick={() => go(i + 1)} aria-label="Next slide">{I.right}</button>
          </div>
        </div>
        <div className="strip" aria-label="Sale at a glance">
          {stats.map(s => <div key={s.label}><span className="ic" aria-hidden="true">{s.icon}</span><div style={{ minWidth: 0 }}><div className="k">{s.label}</div><div className="v tnum">{s.value}</div></div></div>)}
        </div>
      </div>
    </header>
  );
}

/* --------------------------------------------- the shopper's order flow */
type Phase =
  | { kind: "idle" }
  | { kind: "sending"; attempt: number }
  | { kind: "backoff"; attempt: number; waitMs: number; until: number; code: 429 | 503; reason?: string }
  | { kind: "tracking"; orderId: string }
  | { kind: "failed"; message: string }
  | { kind: "gaveup" };

interface Exchange { at: number; text: string; tone?: "ok" | "bad" }

function useOrderFlow(mode: Mode, sim: FlashSim) {
  const key0 = STORE(mode);
  const saved = useMemo(() => safe.get(key0), [key0]);
  const [key, setKey] = useState<string | null>(saved?.key ?? null);
  const [phase, setPhase] = useState<Phase>(saved?.orderId ? { kind: "tracking", orderId: saved.orderId } : { kind: "idle" });
  const [view, setView] = useState<View | null>(null);
  const [resumed] = useState<boolean>(!!saved?.orderId);
  const [codes, setCodes] = useState<number[]>([]);
  const [postMs, setPostMs] = useState<number | null>(null);
  const [ex, setEx] = useState<Exchange[]>([]);
  const t0 = useRef(performance.now());
  const lock = useRef(false);
  const timer = useRef<number | null>(null);
  const note = (text: string, tone?: Exchange["tone"]) => setEx(x => [...x.slice(-80), { at: performance.now() - t0.current, text, tone }]);

  const attempt = useCallback(async (k: string, n: number) => {
    setPhase({ kind: "sending", attempt: n });
    let r: any;
    if (mode === "live") { r = await api.place(k); }
    else { await new Promise(res => setTimeout(res, 350)); r = sim.submit(k); }
    setCodes(c => [...c, r.status]);
    if (mode === "live") {
      if (r.status === 201 || r.status === 200) setPostMs(r.ms);
      note(`POST /api/orders → ${r.status || "network error"}${r.ms !== undefined ? ` in ${Math.round(r.ms)} ms` : ""}${r.view ? ` (order ${short(r.view.id)})` : ""}`, r.status === 201 || r.status === 200 ? "ok" : "bad");
    }
    if (r.status === 201 || r.status === 200) {
      safe.set(key0, { key: k, orderId: r.view.id, scenario: sim.sc.id });
      setView(r.view); setPhase({ kind: "tracking", orderId: r.view.id }); return;
    }
    if (r.status === 429 || r.status === 503 || r.status === 0) {
      if (n >= MAX_ATTEMPTS) { setPhase(r.status === 0 ? { kind: "failed", message: r.message } : { kind: "gaveup" }); lock.current = false; return; }
      if (r.status === 0 && n >= 2) { setPhase({ kind: "failed", message: r.message }); lock.current = false; return; }
      const base = r.status === 503 ? r.retryAfter * 1000 : Math.min(8000, 1000 * 2 ** (n - 1));
      const waitMs = Math.round(base + Math.random() * 300);
      setPhase({ kind: "backoff", attempt: n, waitMs, until: performance.now() + waitMs, code: r.status === 0 ? 503 : r.status, reason: r.status === 503 ? r.reason : r.status === 0 ? r.message : undefined });
      timer.current = window.setTimeout(() => attempt(k, n + 1), waitMs);
      return;
    }
    setPhase({ kind: "failed", message: `${r.status}: ${r.message}` }); lock.current = false;
  }, [mode, sim, key0]);

  const buy = useCallback(() => {
    if (lock.current) return;          // one submission at a time, whatever the click rate
    lock.current = true;
    const k = key ?? uuid(); setKey(k); safe.set(key0, { key: k, scenario: sim.sc.id });
    attempt(k, 1);
  }, [key, attempt, sim, key0]);

  const resendSameKey = useCallback(async () => {
    if (!key) return;
    if (mode === "live") { const r: any = await api.place(key); setCodes(c => [...c, r.status]);
      note(`POST again with the same Idempotency-Key → ${r.status}${r.view ? `, same order ${short(r.view.id)}, nothing new created` : ""}`, r.status === 200 ? "ok" : "bad");
      if (r.view) setView(r.view); }
    else { const r: any = sim.submit(key); if (r.view) setView(r.view); }
  }, [key, sim, mode]);

  const reset = useCallback(() => {
    if (timer.current) window.clearTimeout(timer.current);
    lock.current = false; safe.del(key0); setKey(null); setView(null); setCodes([]); setPostMs(null); setEx([]); setPhase({ kind: "idle" });
  }, [key0]);

  // Poll GET /api/orders/{id} once a second until Completed or Rejected.
  useEffect(() => {
    if (phase.kind !== "tracking") return;
    let stop = false; let lastState = "";
    if (mode === "sim") {
      let o = sim.get(phase.orderId);
      if (!o && saved?.orderId === phase.orderId && sim.started) o = sim.restore(saved);
      const poll = () => { const cur = sim.get(phase.orderId); if (cur) setView(sim.view(cur)); };
      poll(); const id = window.setInterval(poll, 250); return () => window.clearInterval(id);
    }
    const poll = async () => {
      try {
        const v = await api.get(phase.orderId);
        if (stop) return;
        if (!v) { note(`GET /api/orders/${short(phase.orderId)} → not found`, "bad"); return; }
        if (v.state !== lastState) { note(`GET /api/orders/${short(phase.orderId)} → ${v.state}`, v.state === "Rejected" ? "bad" : v.state === "Completed" ? "ok" : undefined); lastState = v.state; }
        setView(v);
        if (v.state === "Completed" || v.state === "Rejected") { stop = true; return; }
      } catch { if (!stop) note("GET failed: the gateway did not answer; trying again in 1 s", "bad"); }
      if (!stop) window.setTimeout(poll, 1000);
    };
    poll();
    return () => { stop = true; };
  }, [phase, mode, sim, sim.started]);

  useEffect(() => () => { if (timer.current) window.clearTimeout(timer.current); }, []);
  return { key, phase, view, buy, reset, resendSameKey, resumed, codes, postMs, ex };
}

/* ------------------------------------------------- tracking (tx list) */
function Track({ view, flow, mode }: { view: View; flow: ReturnType<typeof useOrderFlow>; mode: Mode }) {
  const rejected = view.state === "Rejected";
  const fmt = (ms?: number) => (ms === undefined ? "" : `+${(ms / 1000).toFixed(2)} s`);
  const after = (s: OrderState) => ["Confirmed", "Processing", "Completed", "Rejected"].indexOf(view.state) >= ["Confirmed", "Processing", "Completed", "Rejected"].indexOf(s);
  const rows: Array<{ t: string; s: string; icon: JSX.Element; done: boolean; at?: number; fail?: boolean }> = [
    { t: "Order accepted", s: "Saved as PendingStock with its OrderPlaced event (Outbox)", icon: I.inbox, done: true, at: 0 },
    { t: "Event published", s: "RabbitMQ confirmed the OrderPlaced message", icon: I.send, done: view.state !== "PendingStock" || view.t.published !== undefined, at: view.t.published },
    rejected ? { t: "Sold out", s: "Redis had no stock left: StockRejected, nothing deducted", icon: I.x, done: true, at: view.t.decided, fail: true }
             : { t: "Stock reserved", s: "Redis Lua: duplicate check, stock check, deduct 1", icon: I.box, done: view.state !== "PendingStock", at: view.t.decided },
    ...(rejected ? [] : [
      { t: "Processing", s: "The Process Worker does the downstream work", icon: I.gear, done: view.state === "Processing" || view.state === "Completed", at: view.t.processing },
      { t: "Completed", s: "Your unit is reserved and processed", icon: I.check, done: view.state === "Completed", at: view.t.completed }]),
  ];
  const firstOpen = rows.findIndex(r => !r.done);
  return (
    <div className="card track-card" aria-live="polite">
      <div className="track-head"><h3>Your order <span className="special" style={{ fontWeight: 400 }}>{short(view.id)}</span></h3><StateBadge s={view.state}/></div>
      {view.state === "Completed" && <div className="note alert alert-success"><b>Done.</b> One unit is yours and processed. Payment is outside this project's scope.</div>}
      {rejected && <div className="note alert alert-danger"><b>Sold out before your turn.</b> Your request was accepted, but the stock ran out first. No unit was taken and none was oversold.</div>}
      <ul className="tx">
        {rows.map((r, k) => {
          const cls = r.fail ? "fail" : r.done ? "done" : k === firstOpen ? "now" : "todo";
          const label = r.fail ? "Rejected" : r.done ? "Done" : k === firstOpen ? "Pending" : "Waiting";
          return <li key={r.t} className={cls}><span className="ic">{r.icon}</span><div style={{ minWidth: 0 }}><div className="t">{r.t}</div><div className="s">{r.s}</div></div>
            <div className="r tnum"><b>{label}</b>{r.done && r.at !== undefined ? fmt(r.at) : r.done && mode === "live" && k === 1 ? "via Outbox" : ""}</div></li>;
        })}
      </ul>
      {mode === "live" && view.history.length > 0 && (
        <details><summary className="fine" style={{ cursor: "pointer" }}>State history from GET /api/orders/{"{id}"} ({view.history.length} {view.history.length === 1 ? "row" : "rows"})</summary>
          <div className="table-responsive" style={{ marginTop: 8 }}>
            <table className="table table-sm table-striped align-middle hist-table mb-0">
              <thead><tr><th scope="col">#</th><th scope="col">From</th><th scope="col">To</th><th scope="col" className="text-end">At</th></tr></thead>
              <tbody>{view.history.map((h, k) => <tr key={k}>
                <td className="tnum">{k + 1}</td>
                <td>{h.from ? <StateBadge s={h.from} small/> : "∅"}</td>
                <td><StateBadge s={h.to} small/>{h.implied ? <span className="fine"> (implied)</span> : null}</td>
                <td className="text-end tnum">{fmt(h.at)}</td></tr>)}</tbody>
            </table>
          </div>
        </details>
      )}
      <div className="ids">
        <table className="table table-sm table-borderless ids-table">
          <tbody>
            <tr><th scope="row">Order ID</th><td>{view.id}</td></tr>
            <tr><th scope="row">Idempotency-Key</th><td>{flow.key}</td></tr>
            {view.corr && <tr><th scope="row">Correlation ID</th><td>{view.corr}</td></tr>}
            {view.msgIds && view.msgIds.length > 0 && <tr><th scope="row">Message IDs</th><td>{view.msgIds.join(", ")}</td></tr>}
          </tbody>
        </table>
      </div>
      <div className="row-btns">
        <button className="btn ghost" onClick={flow.resendSameKey}>Send the same request again</button>
        <button className="btn ghost" onClick={flow.reset}>Start over</button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------ the product */
function Product({ mode, sim, flow, onReload }: { mode: Mode; sim: FlashSim; flow: ReturnType<typeof useOrderFlow>; onReload: () => void }) {
  const [fav, setFav] = useState(false);
  const live = mode === "live";
  const status: SaleStatus = live ? "live" : sim.status;
  const claimed = sim.initial - sim.stock;
  const pct = live ? 0 : Math.round((claimed / sim.initial) * 100);
  const secsLeft = Math.max(0, Math.ceil((sim.openAt - sim.now) / 1000));
  const [announce, setAnnounce] = useState(""); const band = useRef(-1);
  useEffect(() => { if (live) return; const b = status === "soldout" ? 100 : Math.floor(pct / 25) * 25;
    if (b !== band.current) { band.current = b; setAnnounce(status === "soldout" ? "Sold out." : status === "live" ? `${pct}% sold, ${sim.stock} left.` : ""); } }, [pct, status, sim.stock, live]);

  const p = flow.phase; const v = flow.view;
  const busy = p.kind === "sending" || p.kind === "backoff";
  const sv = !live && v ? sim.get(v.id) : undefined;
  const pos = sv ? sim.positionOf(sv) : null;
  let label = "Buy now";
  if (!live && !sim.started) label = "Start the sale first";
  else if (status === "upcoming") label = `Opens in ${secsLeft} s`;
  else if (status === "soldout" && p.kind === "idle") label = "Sold out";
  if (p.kind === "sending") label = `Securing your unit… (try ${p.attempt})`;
  if (p.kind === "backoff") label = "Retrying automatically…";
  if (p.kind === "tracking" && v && v.state === "PendingStock") label = pos ? `In line, position #${pos.ahead + 1}` : "Waiting for the stock decision…";
  if (p.kind === "tracking" && v && v.state !== "PendingStock") label = "Order placed";
  const disabled = status !== "live" || p.kind !== "idle";
  const backoffLeft = p.kind === "backoff" ? Math.max(0, p.until - performance.now()) : 0;
  const tag = status === "upcoming" ? (sim.started ? `Opens in 00:${pad(secsLeft)}` : "Coming up") : status === "live" ? "Live now" : "Sold out";

  return (
    <div style={{ display: "grid", gap: 18, minWidth: 0 }}>
      <article className="card product" aria-labelledby="p-name">
        <div className="p-media">
          <span className="p-badge">−60%</span>
          <button className="heart" aria-pressed={fav} aria-label={fav ? "Remove from wishlist" : "Add to wishlist"} onClick={() => setFav(f => !f)}>{I.heart}</button>
          <Earbuds/>
          <span className={`state-tag ${status}`} aria-live="polite"><span className="led"/>{tag}</span>
        </div>
        <div className="p-body">
          <div><div className="p-name" id="p-name">Aurora X2 Wireless Earbuds</div><div className="p-sku">{PRODUCT_ID} · one per order</div></div>
          <div className="price-row"><span className="price-now tnum">{vnd(PRICE_NOW)}</span><span className="price-was tnum">{vnd(PRICE_WAS)}</span></div>
          {live ? (
            <div className="note alert alert-info"><span>Live stock is held in Redis and is not exposed through the gateway, so this page shows your own order only. The crowd counters run in <b>Simulation</b>.</span></div>
          ) : (
            <div style={{ display: "grid", gap: 8 }}>
              <div className="sold-row"><span>{status === "soldout" ? "No units left" : `Only ${sim.stock.toLocaleString()} left`}</span><b className="tnum">{claimed.toLocaleString()} sold</b></div>
              <div className="meter" role="progressbar" aria-label="Units sold" aria-valuemin={0} aria-valuemax={sim.initial} aria-valuenow={claimed}><span style={{ width: `${pct}%` }}/></div>
              <div className="sr" aria-live="polite">{announce}</div>
            </div>
          )}
          <button className={`btn buy ${busy ? "busy" : ""}`} disabled={disabled} onClick={flow.buy} aria-describedby="buy-help">{I.bag}{label}</button>
          <div id="buy-help" className="fine">The button locks after the first press, so repeated clicks still send one order. Retries reuse the same Idempotency-Key.</div>
          <div aria-live="assertive" style={{ display: "contents" }}>
            {p.kind === "backoff" && (
              <div className="note alert alert-warning"><span><span className="badge text-bg-warning code-badge">{p.code}</span><b>Traffic is heavy.</b> {p.code === 429 ? "The gateway answered 429 Too Many Requests." : `The order service answered 503 (${p.reason}) and asked us to wait.`} Retrying in {(backoffLeft / 1000).toFixed(1)} s, try {p.attempt + 1} of {MAX_ATTEMPTS}.</span>
                <div className="backoff"><span style={{ width: `${100 - (backoffLeft / p.waitMs) * 100}%` }}/></div></div>
            )}
            {p.kind === "gaveup" && <div className="note alert alert-danger"><b>Could not get through after {MAX_ATTEMPTS} tries.</b> No order was created. Press Start over to try again.</div>}
            {p.kind === "failed" && <div className="note alert alert-danger"><b>The order did not go through.</b> {p.message}. Nothing was created. <button className="btn ghost" style={{ justifySelf: "start" }} onClick={flow.reset}>Start over</button></div>}
          </div>
          {!live && status === "soldout" && !v && <div className="note alert alert-danger" role="status"><b>Sold out.</b> All {sim.initial.toLocaleString()} units were reserved by earlier orders; {sim.c.rejected.toLocaleString()} later orders were rejected and none was oversold.</div>}
          {flow.resumed && v && <div className="note alert alert-info">Restored after the reload: still tracking order {short(v.id)} with the same Idempotency-Key.</div>}
          {!live && v && v.state === "PendingStock" && pos && <div className="note alert alert-info">Accepted. {pos.ahead} orders ahead of yours in the Inventory queue.</div>}
          {!live && v && v.state === "Confirmed" && pos && <div className="note alert alert-info">One unit is reserved for you. {pos.ahead} orders ahead of yours at the Process Worker.</div>}
          <div className="row-btns"><button className="btn ghost" onClick={onReload} title="Reload the shop card; the order is kept in this browser">Reload the shop card</button></div>
        </div>
      </article>
      {v && <Track view={v} flow={flow} mode={mode}/>}
    </div>
  );
}

/* ---------------------------------------------------------- system side */
function Stage({ logo, sub, title, what, here, children }: { logo: JSX.Element; sub?: JSX.Element; title: string; what: string; here?: boolean; children?: any }) {
  return (
    <div className={`stage ${here ? "here" : ""}`}>
      {here && <span className="you">your order</span>}
      <div className="logo" aria-hidden="true">{logo}{sub && <span className="sub">{sub}</span>}</div>
      <div><h4>{title}</h4><div className="what">{what}</div></div>
      <div className="nums">{children}</div>
    </div>
  );
}
const Q = ({ n, max }: { n: number; max: number }) => <div className="qbar" aria-hidden="true"><span style={{ width: `${Math.min(100, (n / max) * 100)}%` }}/></div>;

function System({ mode, sim, flow, why }: { mode: Mode; sim: FlashSim; flow: ReturnType<typeof useOrderFlow>; why: string }) {
  const live = mode === "live";
  const c = sim.c; const r = sim.rate; const v = flow.view;
  const sv = !live && v ? sim.get(v.id) : undefined;
  let where = sv ? sim.positionOf(sv).stage : "";
  if (live && v) where = v.state === "PendingStock" ? "inventory" : v.state === "Confirmed" || v.state === "Processing" ? "worker" : "";
  if (flow.phase.kind === "sending" || flow.phase.kind === "backoff") where = "gateway";
  const logRef = useRef<HTMLDivElement>(null);
  const lines: LogLine[] = live ? flow.ex.map(e => ({ at: e.at, src: "you", text: e.text, tone: e.tone })) : sim.log;
  useEffect(() => { const el = logRef.current; if (el) el.scrollTop = el.scrollHeight; }, [lines.length]);
  const fmt = (ms: number) => `${(ms / 1000).toFixed(2)}s`;
  const codes = flow.codes.length ? flow.codes.map(x => x || "err").join(" → ") : "–";
  return (
    <div className="card sys" style={{ minWidth: 0 }} aria-labelledby="sys-h">
      <div className="sys-head"><h3 id="sys-h">Behind the Buy button</h3><span className={`badge rounded-pill chip ${live ? "text-bg-success" : "text-bg-warning"}`}>{live ? "Live API" : "Simulated in the browser"}</span></div>
      {!live && why && <div className="note alert alert-warning"><span><b>Running the simulation.</b> The live API is not reachable ({why}). Start the stack and open the page with <code>node demo-results/ui/serve.mjs</code> to use the real services.</span></div>}
      <div className="kpis">
        {live ? <>
          <div className="kpi"><div className="k">Your attempts</div><div className="v tnum">{flow.codes.length}</div></div>
          <div className="kpi"><div className="k">HTTP answers</div><div className="v tnum" style={{ fontSize: 18 }}>{codes}</div></div>
          <div className="kpi"><div className="k">POST answer</div><div className="v tnum">{flow.postMs !== null ? Math.round(flow.postMs) : "–"} <small>ms</small></div></div>
          <div className="kpi"><div className="k">Stock decided</div><div className="v tnum">{v?.t.decided !== undefined ? (v.t.decided / 1000).toFixed(2) : "–"} <small>s</small></div></div>
          <div className="kpi"><div className="k">Completed</div><div className="v tnum">{v?.t.completed !== undefined ? (v.t.completed / 1000).toFixed(2) : "–"} <small>s</small></div></div>
        </> : <>
          <div className="kpi"><div className="k">Orders sent</div><div className="v tnum">{c.offered.toLocaleString()} <small>{r.offered.toFixed(0)}/s</small></div></div>
          <div className="kpi"><div className="k">Refused early</div><div className="v tnum">{(c.r429 + c.r503).toLocaleString()} <small>{c.r429} / {c.r503}</small></div></div>
          <div className="kpi"><div className="k">Reserved</div><div className="v tnum">{c.reserved.toLocaleString()} <small>of {sim.initial.toLocaleString()}</small></div></div>
          <div className="kpi"><div className="k">Sold out</div><div className="v tnum">{c.rejected.toLocaleString()}</div></div>
          <div className="kpi"><div className="k">Completed</div><div className="v tnum">{c.completed.toLocaleString()} <small>{r.completed.toFixed(0)}/s</small></div></div>
        </>}
      </div>
      <div className="pipe">
        <Stage logo={<Logo slug="nginx" size={26}/>} title="Nginx gateway" what={live ? "Rate limit on POST /api/orders; excess gets 429 at once." : `Rate limit ${sim.sc.nginxRatePerSec}/s, burst ${sim.sc.nginxBurst}. Excess gets 429 at once.`} here={where === "gateway"}>
          {!live && <><span>{r.offered.toFixed(0)} requests/s</span><span className="bad">429 refused: {c.r429.toLocaleString()}</span></>}
        </Stage>
        <div className="link" aria-hidden="true">POST /api/orders + Idempotency-Key</div>
        <Stage logo={<Logo slug="dotnet" size={26}/>} sub={<Logo slug="postgresql" size={15}/>} title="Order Service + Outbox" what="Admission check, then the order (PendingStock) and its event in one PostgreSQL transaction; answers 201." here={where === "outbox"}>
          {!live && <><span className="ok">201 accepted: {c.accepted.toLocaleString()}</span><span className="bad">503 refused: {c.r503.toLocaleString()}{sim.sc.maxInFlight ? ` (limit ${sim.sc.maxInFlight})` : ""}</span><span>unfinished: {sim.inFlight.toLocaleString()}</span></>}
        </Stage>
        <div className="link" aria-hidden="true">OrderPlaced · publisher confirm</div>
        <Stage logo={<Logo slug="rabbitmq" size={26}/>} title="RabbitMQ" what="Durable queues with bounded length, an Inbox on every consumer and a dead-letter queue per service.">
          {!live && <><span>to inventory: {(sim.invQueue.length + sim.outbox.length).toLocaleString()}</span><Q n={sim.invQueue.length} max={300}/></>}
        </Stage>
        <div className="link" aria-hidden="true">at-least-once delivery</div>
        <Stage logo={<Logo slug="redis" size={26}/>} sub={<Logo slug="lua" size={15}/>} title="Inventory Service + Redis Lua" what="One atomic script: duplicate check, stock check, deduct 1. Answers StockReserved or StockRejected." here={where === "inventory"}>
          {!live && <><span>stock in Redis: {sim.stock.toLocaleString()}</span><span className="ok">reserved {c.reserved.toLocaleString()}</span><span className="bad">rejected {c.rejected.toLocaleString()}</span></>}
        </Stage>
        <div className="link" aria-hidden="true">StockReserved → Confirmed</div>
        <Stage logo={<Logo slug="dotnet" size={26}/>} sub={<Logo slug="rabbitmq" size={15}/>} title="Process Worker" what={`Deterministic downstream work: ${WORKER_DELAY_MS} ms per order${live ? "" : `, ${sim.workerConcurrency} at a time`}. Then Completed.`} here={where === "worker"}>
          {!live && <><span>waiting {sim.workerQueue.length} · working {sim.busy.length}</span><Q n={sim.workerQueue.length} max={300}/><span className="ok">completed {c.completed.toLocaleString()}</span></>}
        </Stage>
      </div>
      <div>
        <div className="sys-head" style={{ marginBottom: 8 }}><h3 style={{ fontSize: 16 }}>Event log</h3><span className="fine">{live ? "the requests this page sent" : "your order and the key moments"}</span></div>
        <div className="log" ref={logRef} role="log" aria-label="Event log">
          {lines.length === 0 && <div><time>–</time><span>Nothing yet. Press Buy now.</span></div>}
          {lines.map((l, k) => <div key={k}><time>{fmt(l.at)}</time><span><span className="src">{l.src}</span> <span className={l.tone ? `e-${l.tone}` : ""}>{l.text}</span></span></div>)}
        </div>
      </div>
    </div>
  );
}

/* --------------------------------------------------- flash sale section */
function FlashSale({ mode, setMode, liveOk, why, sim, scId, pick, workers, setWorkers, reloadKey, onReload }: any) {
  const flow = useOrderFlow(mode, sim);
  const live = mode === "live";
  const elapsed = Math.max(0, Math.floor((sim.now - sim.openAt) / 1000));
  const [clockNow, setClockNow] = useState(Date.now());
  useEffect(() => { const id = window.setInterval(() => setClockNow(Date.now()), 1000); return () => window.clearInterval(id); }, []);
  const clock = live ? ["Live", new Date(clockNow).toLocaleTimeString("en-GB")] : !sim.started ? ["Ready", "00:00:00"] : sim.status === "upcoming" ? ["Opens in", hms(Math.ceil((sim.openAt - sim.now) / 1000))] : sim.status === "soldout" ? ["Sold out at", hms(elapsed)] : ["Live for", hms(elapsed)];
  const sc = SCENARIOS.find(s => s.id === scId)!;
  return (
    <section className="block" id="sale" aria-labelledby="sale-h">
      <div className="wrap">
        <div className="sec-head">
          <div>
            <span className="kicker">Today only</span>
            <div className="fs-top">
              <div className="fs-title"><span className="bolt-badge" aria-hidden="true">{I.bolt}</span><h2 id="sale-h">Flash Sale</h2></div>
              <span className="clock tnum" role="timer" aria-label={`${clock[0]} ${clock[1]}`}>{I.clock}<small>{clock[0]}</small>{clock[1]}</span>
            </div>
          </div>
          <div className="row-btns" role="group" aria-label="Where the orders go">
            <button className="btn pill-btn" aria-pressed={live} disabled={!liveOk} onClick={() => setMode("live")} title={liveOk ? "Send real orders through the gateway" : `Live API not reachable: ${why}`}>Live API</button>
            <button className="btn pill-btn" aria-pressed={!live} onClick={() => setMode("sim")}>Simulation</button>
          </div>
        </div>
        {!live && <>
          <div className="pills" role="group" aria-label="Scenario">
            {SCENARIOS.map(s => <button key={s.id} className="btn pill-btn" aria-pressed={s.id === scId} onClick={() => pick(s.id)}>{s.label}</button>)}
            <label className="btn pill-btn" style={{ display: "inline-flex", gap: 8, alignItems: "center" }}>Worker
              <select value={workers} onChange={e => setWorkers(Number(e.target.value))} aria-label="Worker concurrency">
                <option value={1}>1 at a time</option><option value={8}>8 at a time</option><option value={32}>32 at a time</option>
              </select></label>
            <button className="btn pill-btn go" disabled={sim.started} onClick={() => sim.start()}>Start the sale</button>
            <button className="btn pill-btn" onClick={() => pick(scId)}>Reset</button>
          </div>
          <p className="scenario-note">{sc.blurb}</p>
        </>}
        {live && <p className="scenario-note" style={{ marginTop: 10 }}>Real orders: <code>POST /api/orders</code> through Nginx, then <code>GET /api/orders/{"{id}"}</code> once a second until Completed or Rejected. Reload the browser tab to see the order come back from the database.</p>}
        <div className="row g-4 align-items-start fs-grid">
          <div className="col-12 col-lg-5"><Product key={`${mode}-${scId}-${reloadKey}`} mode={mode} sim={sim} flow={flow} onReload={onReload}/></div>
          <div className="col-12 col-lg-7"><System mode={mode} sim={sim} flow={flow} why={why}/></div>
        </div>
        <div className="row row-cols-2 row-cols-lg-4 g-3 drop" aria-label="Next drops">
          {[
            { n: "Nimbus Hoodie", bg: "var(--pink)", art: <Hoodie/>, p: 459000, w: 765000, off: "−40%" },
            { n: "Pulse Watch S", bg: "var(--sky)", art: <Watch/>, p: 1290000, w: 2150000, off: "−40%" },
            { n: "Echo Mini Speaker", bg: "var(--lilac)", art: <Speaker/>, p: 690000, w: 1150000, off: "−40%" },
            { n: "Market Tote", bg: "var(--butter)", art: <Tote/>, p: 149000, w: 299000, off: "−50%" },
          ].map(t => <div className="col" key={t.n}><Tile {...t}/></div>)}
        </div>
      </div>
    </section>
  );
}
function Tile({ n, bg, art, p, w, off }: any) {
  const [fav, setFav] = useState(false);
  return (
    <article className="card tile h-100">
      <div className="p-media" style={{ background: bg }}>
        <span className="p-badge">{off}</span>
        <button className="heart" aria-pressed={fav} aria-label={fav ? `Remove ${n} from wishlist` : `Add ${n} to wishlist`} onClick={() => setFav(f => !f)}>{I.heart}</button>
        {art}
      </div>
      <div className="body"><div className="nm">{n}</div><div className="pr"><b className="tnum">{vnd(p)}</b><s className="tnum">{vnd(w)}</s></div><div className="soon">Next drop · preview only</div></div>
    </article>
  );
}

/* ------------------------------------------------------------ the stack */
const STACK: Array<{ slug: string; name: string; role: string }> = [
  { slug: "dotnet", name: ".NET 10", role: "Order, Inventory, Worker" },
  { slug: "abp", name: "ABP Framework", role: "service modules" },
  { slug: "postgresql", name: "PostgreSQL", role: "orders, Outbox, Inbox" },
  { slug: "redis", name: "Redis", role: "stock, atomic Lua" },
  { slug: "lua", name: "Lua", role: "reserve.lua" },
  { slug: "rabbitmq", name: "RabbitMQ", role: "events, confirms, DLQ" },
  { slug: "nginx", name: "NGINX", role: "gateway, 429" },
  { slug: "docker", name: "Docker Compose", role: "the whole stack" },
  { slug: "apachejmeter", name: "Apache JMeter", role: "open-loop load" },
  { slug: "terraform", name: "Terraform", role: "EC2 hosts" },
  { slug: "amazonec2", name: "Amazon EC2", role: "official runs" },
  { slug: "prometheus", name: "Prometheus", role: "metrics" },
  { slug: "grafana", name: "Grafana", role: "dashboards" },
  { slug: "swagger", name: "OpenAPI", role: "API contract" },
  { slug: "react", name: "React", role: "this page" },
  { slug: "github", name: "GitHub", role: "source" },
];
function TechChip({ t, dup }: { t: typeof STACK[number]; dup?: boolean }) {
  return (
    <div className="tech" {...(dup ? { "data-dup": "", "aria-hidden": true } : {})}>
      <span className="lg">{t.slug === "abp" ? <span className="abp" aria-label="ABP">abp</span> : <Logo slug={t.slug} size={26}/>}</span>
      <div><b>{t.name}</b><span>{t.role}</span></div>
    </div>
  );
}
function Stack() {
  const [paused, setPaused] = useState(false);
  const reduce = useReducedMotion();
  const a = STACK.slice(0, 8), b = STACK.slice(8);
  return (
    <section className={`stack ${paused ? "paused" : ""}`} id="stack" aria-labelledby="stack-h">
      <div className="wrap"><div className="sec-head"><div><span className="kicker">The stack</span><h2 id="stack-h">Everything it runs on</h2><p>Three .NET services, two data stores, one broker and a gateway, measured with JMeter on AWS.</p></div>
        {!reduce && <button className="stack-pause" onClick={() => setPaused(p => !p)} aria-pressed={paused}>{paused ? "Play" : "Pause"} the logos</button>}</div></div>
      <div className="marquee"><div className="m-run">{a.map(t => <TechChip key={t.slug} t={t}/>)}{a.map(t => <TechChip key={t.slug + "-d"} t={t} dup/>)}</div></div>
      <div className="marquee rev"><div className="m-run">{b.map(t => <TechChip key={t.slug} t={t}/>)}{b.map(t => <TechChip key={t.slug + "-d"} t={t} dup/>)}</div></div>
    </section>
  );
}

/* --------------------------------------------------- how it works + numbers */
function How() {
  const steps = [
    { n: "01", h: "Accept fast, decide later", p: "The Order Service checks admission, saves the order and its OrderPlaced event in one transaction, and answers 201 with the order ID.", l: ["nginx", "dotnet", "postgresql"] },
    { n: "02", h: "One atomic stock decision", p: "Inventory runs one Redis Lua script per message: skip duplicates, check stock, deduct one. StockReserved or StockRejected goes back over RabbitMQ.", l: ["rabbitmq", "redis", "lua"] },
    { n: "03", h: "Finish, then show it", p: "The Process Worker completes confirmed orders. The shopper's page polls GET /api/orders/{id} and shows each state with its time.", l: ["dotnet", "rabbitmq", "react"] },
  ];
  return (
    <section className="block" id="how" aria-labelledby="how-h">
      <div className="wrap">
        <div className="sec-head"><div><span className="kicker">How it works</span><h2 id="how-h">From Buy to Completed in three steps</h2><p>The six states the teacher's brief names: PendingStock, Confirmed, Rejected, Processing, Completed, and ProcessingFailed, which this Worker never reaches.</p></div></div>
        <div className="row row-cols-1 row-cols-md-3 g-3 steps3">{steps.map(s => <div key={s.n} className="col"><div className="card step h-100"><span className="num">{s.n}</span><h3>{s.h}</h3><p>{s.p}</p><div className="logos">{s.l.map(x => <span key={x}><Logo slug={x} size={20}/></span>)}</div></div></div>)}</div>
      </div>
    </section>
  );
}
function Measured() {
  return (
    <section className="block" id="measured" aria-labelledby="m-h">
      <div className="wrap">
        <div className="sec-head"><div><span className="kicker">Measured, not promised</span><h2 id="m-h">What the EC2 runs showed</h2><p>Every number below comes from the report's Results chapter and its evidence folders.</p></div></div>
        <div className="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 measured">
          <div className="col"><div className="card stat h-100"><div className="big">66<span className="arrow">/</span>66</div><div className="lbl">official runs passed</div><p>22 cells × 3 repeats, configurations C1 to C4; every correctness check held in every run.</p></div></div>
          <div className="col"><div className="card stat h-100"><div className="big">0</div><div className="lbl">units oversold</div><p>The validator checks stock, reservations and orders per product after every run.</p></div></div>
          <div className="col"><div className="card stat h-100"><div className="big">0.04–0.06</div><div className="lbl">ms per Redis call</div><p>Redis was never the limit; the two vCPUs of the host were.</p></div></div>
          <div className="col"><div className="card stat h-100"><div className="big">326<span className="arrow">→</span>43 s</div><div className="lbl">worst drain, before and after</div><p>The Worker back-pressure fix: 0 dead letters in 9 of 9 runs, drains in 29–43 s instead of up to 326 s.</p></div></div>
        </div>
        <p className="src-note">Sources: tests/evidence/20261105T104832Z-official (TP-X02) and tests/evidence/20261107T060310Z-backpressure-ab (TP-X14).</p>
      </div>
    </section>
  );
}

/* -------------------------------------------------------------------- app */
function App() {
  const [theme, setTheme] = useState<string | null>(() => safe.get("flashsale-shop-theme"));
  useEffect(() => { if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme"); }, [theme]);
  // Bootstrap's own dark mode (tables, alerts, badges) follows the same choice, or the system setting when none is saved.
  useEffect(() => {
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const apply = () => document.documentElement.setAttribute("data-bs-theme", theme ?? (mq.matches ? "dark" : "light"));
    apply(); mq.addEventListener?.("change", apply); return () => mq.removeEventListener?.("change", apply);
  }, [theme]);
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const toggleTheme = () => { const t = dark ? "light" : "dark"; setTheme(t); safe.set("flashsale-shop-theme", t); };

  const [probe, setProbe] = useState<{ done: boolean; ok: boolean; why: string }>({ done: false, ok: false, why: "" });
  const [mode, setModeRaw] = useState<Mode>("probing");
  useEffect(() => { api.probe().then(r => { setProbe({ done: true, ...r }); setModeRaw(m => (m === "probing" ? (r.ok ? "live" : "sim") : m)); }); }, []);
  const setMode = (m: Mode) => setModeRaw(m);

  const savedSim = safe.get(STORE("sim"));
  const [scId, setScId] = useState<ScenarioId>((savedSim?.scenario as ScenarioId) ?? "success");
  const [workers, setWorkers] = useState(8);
  const simRef = useRef<FlashSim>(new FlashSim(SCENARIOS.find(s => s.id === scId)!, workers));
  const [, setTick] = useState(0);
  const [reloadKey, setReloadKey] = useState(0);
  const sim = simRef.current;
  useEffect(() => {
    if (savedSim?.orderId && !sim.started) sim.start();
    const id = window.setInterval(() => { sim.tick(); setTick(t => t + 1); }, 100);
    return () => window.clearInterval(id);
  }, [sim]);
  useEffect(() => { simRef.current.workerConcurrency = workers; }, [workers]);
  const pick = (id: ScenarioId) => { safe.del(STORE("sim")); setScId(id); simRef.current = new FlashSim(SCENARIOS.find(s => s.id === id)!, workers); setReloadKey(k => k + 1); };
  const shop = (heavy?: boolean) => { document.getElementById("sale")?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); if (heavy && mode !== "live") pick("traffic"); };

  // active tab for the phone tab bar
  const [active, setActive] = useState("home");
  useEffect(() => {
    const ids = ["home", "sale", "stack", "measured"];
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }), { rootMargin: "-45% 0px -50% 0px" });
    ids.forEach(i => { const el = document.getElementById(i); if (el) io.observe(el); });
    return () => io.disconnect();
  }, [mode === "probing"]);

  const live = mode === "live";
  const stats = live
    ? [{ label: "Orders go to", value: "Real API", icon: I.send }, { label: "Product", value: PRODUCT_ID, icon: I.box }, { label: "Price", value: vnd(PRICE_NOW), icon: I.receipt }, { label: "Limit", value: "1 per order", icon: I.shield }]
    : [{ label: "Units left", value: sim.stock.toLocaleString(), icon: I.stock }, { label: "Shoppers sent", value: sim.c.offered.toLocaleString(), icon: I.users }, { label: "Reserved", value: sim.c.reserved.toLocaleString(), icon: I.box }, { label: "Completed", value: sim.c.completed.toLocaleString(), icon: I.check }];
  const ticker = ["Flash sale today", "Up to 60% off", "One unit per order", "Never oversold", "Retries keep your place", "Free returns on the next drop"];

  return (
    <>
      <a href="#sale" className="sr" style={{ position: "absolute" }}>Skip to the flash sale</a>
      <div className="ticker" aria-label="Promotions"><div className="run">{ticker.map(t => <span key={t}>{t}</span>)}{ticker.map(t => <span key={t + "d"} data-dup="" aria-hidden="true">{t}</span>)}</div></div>
      <nav className="navbar navbar-expand-md topnav" data-bs-theme="dark" aria-label="Main">
        <div className="wrap">
          <a className="navbar-brand brand" href="#home"><span className="brand-mark">{I.bolt}</span>FlashSale<small>SHOP</small></a>
          <div className="navbar-nav nav-links"><a className="nav-link" href="#sale">Flash sale</a><a className="nav-link" href="#how">How it works</a><a className="nav-link" href="#stack">Stack</a><a className="nav-link" href="#measured">Results</a></div>
          <span className={`mode ${mode === "probing" ? "probe" : live ? "live" : "sim"}`} role="status" title={probe.done && !probe.ok ? `Live API not reachable: ${probe.why}` : ""}>
            <span className="led"/>{mode === "probing" ? "Checking the API…" : live ? "Live API" : "Simulation"}</span>
          <button className="theme-btn" onClick={toggleTheme} aria-label={dark ? "Switch to light theme" : "Switch to dark theme"}>{dark ? I.sun : I.moon}</button>
        </div>
      </nav>
      <Hero onShop={() => shop()} stats={stats}/>
      <main>
        {mode === "probing"
          ? <section className="block" id="sale"><div className="wrap"><div className="card" style={{ padding: 24 }}>Checking whether the live API is reachable…</div></div></section>
          : <FlashSale mode={mode} setMode={setMode} liveOk={probe.ok} why={probe.why} sim={sim} scId={scId} pick={pick} workers={workers} setWorkers={setWorkers} reloadKey={reloadKey} onReload={() => setReloadKey(k => k + 1)}/>}
        <How/>
        <Stack/>
        <Measured/>
      </main>
      <footer><div className="wrap"><span><b className="special" style={{ color: "var(--ink)" }}>FlashSale Shop</b> · demo storefront for the flash-sale microservices capstone</span><span>Logos: Simple Icons (CC0); trademarks belong to their owners.</span></div></footer>
      <nav className="tabbar" aria-label="Sections">
        {[["home", "Home", I.home], ["sale", "Sale", I.bolt], ["stack", "Stack", I.layers], ["measured", "Results", I.receipt]].map(([id, l, ic]: any) =>
          <a key={id} href={`#${id}`} className={active === id ? "on" : ""} aria-current={active === id ? "true" : undefined}>{ic}{l}</a>)}
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")!).render(<App/>);
</script>
